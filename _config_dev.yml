_data/
  navigation.yml       # главное меню
  sidebars.yml         # наборы ссылок для сайдбаров

_posts/                # лента новостей (НАЧАЛО)
  2026-03-11-title.md  # front matter: pinned: true для закреплённых

_saints/               # Собор святых СПАЦ
