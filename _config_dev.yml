
#
# This config-file is only needed for development. Instead of changing the url
# everytime you work locally on the project, you start both config-files, overwriting
# the first one with the development variables needed.
#
# Start development with › $ jekyll serve --config _config.yml,_config_dev.yml

title: "СПАЦ"
description: ""
url: "https://church-site-3ln.pages.dev"
baseurl: ""
timezone: "Europe/Moscow"
lang: "ru"

# Убрать "ряд" из мобильного меню
# (в теме это управляется через _data/navigation.yml и шаблон)

permalink: /news/:year/:slug/

paginate: 10
paginate_path: "/news/page:num/"

collections:
  saints:
    output: true
    permalink: /saints/:slug/
  parishes:
    output: true
    permalink: /parishes/:slug/
  documents:
    output: true
    permalink: /documents/:slug/
  canons:
    output: true
    permalink: /canons/:slug/
  library:
    output: true
    permalink: /library/:slug/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      sidebar: false
  - scope:
      path: "_saints"
      type: saints
    values:
      layout: page
      sidebar: lik
  - scope:
      path: "_parishes"
      type: parishes
    values:
      layout: page
      sidebar: false
  - scope:
      path: "_library"
      type: library
    values:
      layout: page
      sidebar: false

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
```

---

### Карта файлов и папок
```
